<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./css/style.css">
  
  <title>Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  
</head>
<body>

  <div class="container">

    <div class="image-para">
      <img src="./assets/images/avatar-jessica.jpeg" alt="">
      <h1 class="title">Jessica Randall</h1>
      <p class="location">London, United Kingdom</p>
      <p class="job-title">"Front-end developer and avid reader."</p>
    </div>

    <div class="button-card">
      <button class="btn">Github</button>
      <button class="btn">Frontend Mentor</button>
      <button class="btn">Linkedin</button>
      <button class="btn">Twitter</button>
      <button class="btn">Instagram</button>
    </div>

  </div>
 
  
  <footer class="attribution">
 
    Coded by <a href="https://github.com/dhruvijadejaa">Dhruviba Jadeja</a>.
  </footer>
</body>
</html>
