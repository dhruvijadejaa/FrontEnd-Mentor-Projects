<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>CONTACT FORM</title>
</head>
<body>
  
  <div class="contact">
    <h1>Contact Us</h1>
    <form novalidate>
      <div class="form-group">
        <label for="fname">First Name</label>
        <input type="text" name="first_name" id="fname" required data-error="a" >

      </div>  

      <div class="form-group">
        <label for="lname">Last Name</label>
        <input type="text" name="last_name" id="lname" required data-error="a">
      </div>

      <div class="form-group span-all">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" required data-error="a">
      </div>

      <fieldset class="span-all">
        <legend>Query Type</legend>

        <div class="form-group">
        <label for="general">General enquiry</label>
        <input type="radio" name="query" id="general" required data-error="a">
        </div>

        <div class="form-group">
        <label for="request">Support Request</label>
        <input type="radio" name="query" id="request" required data-error="a">
        </div>


      </fieldset>

      <div class="form-group span-all">
        <label for="message">Message</label>
        <textarea name="message" id="message" required></textarea>
      </div>

      <div class="form-group span-all">
        <input type="checkbox" name="consent" id="consent" required data-error="a">
        <label for="consent">I consent to being contacted by the team</label>
      </div>

      <button class="span-all">submit</button>
    

    </form>
  </div>
  
</body>
</html>
